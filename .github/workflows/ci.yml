name: CI - Build & Test InnovaCore

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend: compilar, testear y generar cobertura JaCoCo ──
  backend:
    name: Backend - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: 'eureka-server', path: 'eureka-server' }
          - { name: 'api-gateway',   path: 'api-gateway' }
          - { name: 'ms-seguridad',  path: 'ms-seguridad/ms-seguridad' }
          - { name: 'ms-proyectos',  path: 'ms-proyectos/ms-proyectos' }
          - { name: 'ms-recursos',   path: 'ms-recursos/ms-recursos' }
          - { name: 'ms-analitica',  path: 'ms-analitica' }
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: mvn clean compile -DskipTests

      - name: Ejecutar tests y generar cobertura JaCoCo
        working-directory: ${{ matrix.service.path }}
        run: mvn test jacoco:report
        continue-on-error: true

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/target/site/jacoco/
          if-no-files-found: ignore

      - name: Empaquetar ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: mvn package -DskipTests

  # ── Frontend: instalar, testear con cobertura y build ──
  frontend:
    name: Frontend - InnovaCore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: innovacore-frontend
        run: npm install

      - name: Ejecutar tests con cobertura
        working-directory: innovacore-frontend
        run: npm run test:coverage

      - name: Subir reporte cobertura frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: innovacore-frontend/coverage/
          if-no-files-found: ignore

      - name: Build frontend
        working-directory: innovacore-frontend
        run: npm run build

  # ── Resumen final ──
  summary:
    name: Resumen del Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## InnovaCore CI/CD - Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Backend: 6 microservicios compilados, testeados y empaquetados" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend: tests con cobertura ejecutados y build generado" >> $GITHUB_STEP_SUMMARY
          echo "📊 Reportes JaCoCo disponibles en los artifacts de cada microservicio" >> $GITHUB_STEP_SUMMARY