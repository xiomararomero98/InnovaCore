spring.application.name=ms-analitica
server.port=${SERVER_PORT:8084}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3310/db_analitica}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root1234}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin1234

# URLs de los otros microservicios (para WebClient)
ms.seguridad.url=http://localhost:8081
ms.proyectos.url=http://localhost:8082
ms.recursos.url=http://localhost:8083

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ==========================================================
# Actuator - Endpoints para monitorear Circuit Breaker
# ==========================================================
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ==========================================================
# Resilience4j Circuit Breaker
# ==========================================================
# Configuración para el Circuit Breaker que protege llamadas a ms-proyectos
resilience4j.circuitbreaker.instances.ms-proyectos.register-health-indicator=true
resilience4j.circuitbreaker.instances.ms-proyectos.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ms-proyectos.sliding-window-size=5
resilience4j.circuitbreaker.instances.ms-proyectos.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.ms-proyectos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-proyectos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-proyectos.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.ms-proyectos.automatic-transition-from-open-to-half-open-enabled=true

# Configuración para el Circuit Breaker que protege llamadas a ms-recursos
resilience4j.circuitbreaker.instances.ms-recursos.register-health-indicator=true
resilience4j.circuitbreaker.instances.ms-recursos.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ms-recursos.sliding-window-size=5
resilience4j.circuitbreaker.instances.ms-recursos.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.ms-recursos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-recursos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-recursos.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.ms-recursos.automatic-transition-from-open-to-half-open-enabled=true

# Timeout para las llamadas (TimeLimiter)
resilience4j.timelimiter.instances.ms-proyectos.timeout-duration=5s
resilience4j.timelimiter.instances.ms-recursos.timeout-duration=5s